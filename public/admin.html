<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Quick Admin</title>
</head>
<body>
<input type="text" id="t" placeholder="GitHub Token">
<button onclick="save()">Проверить связь</button>
<div id="out"></div>

<script>
        async function save() {
            const token = document.getElementById('t').value;
            const url = `https://api.github.com/repos/vic-odessa-shop/shop-test/contents/products.json`;

            try {
                const res = await fetch(url, {
                    headers: { 'Authorization': `token ${token}` }
                });
                const data = await res.json();
                if (res.ok) {
                    document.getElementById('out').innerText = "✅ Связь есть! SHA файла: " + data.sha;
                } else {
                    document.getElementById('out').innerText = "❌ Ошибка: " + data.message;
                }
            } catch (e) {
                document.getElementById('out').innerText = "❌ Ошибка запроса";
            }
        }
    </script>
</body>
</html>
