<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Адмін-панель VIC ODESSA</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; padding: 20px; background: #f0f2f5; color: #333; }
        .container { max-width: 900px; margin: 0 auto; }
        .card { background: white; padding: 25px; border-radius: 15px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); margin-bottom: 25px; }

        h2, h4 { margin-top: 0; color: #0088cc; }

        .grid-form { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .full-width { grid-column: span 2; }

        label { display: block; font-size: 13px; font-weight: bold; margin-bottom: 5px; color: #666; }
        input, textarea, select {
            width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px;
            box-sizing: border-box; font-size: 14px; outline: none; transition: 0.3s;
        }
        input:focus { border-color: #0088cc; box-shadow: 0 0 5px rgba(0,136,204,0.2); }

        .btn {
            padding: 12px 25px; border: none; border-radius: 8px; cursor: pointer;
            font-weight: bold; transition: 0.2s; text-transform: uppercase;
        }
        .save-btn { background: #28a745; color: white; width: 100%; margin-top: 10px; }
        .save-btn:hover { background: #218838; }

        table { width: 100%; border-collapse: collapse; background: white; border-radius: 10px; overflow: hidden; }
        th, td { padding: 15px; text-align: left; border-bottom: 1px solid #eee; }
        th { background: #f8f9fa; color: #666; font-size: 12px; }

        .img-preview { width: 50px; height: 50px; object-fit: cover; border-radius: 5px; background: #eee; }
        .stock-tag { padding: 4px 8px; border-radius: 5px; font-size: 12px; font-weight: bold; }
        .low { background: #ffebee; color: #c62828; }
        .ok { background: #e8f5e9; color: #2e7d32; }
    </style>
</head>
<body>

<div class="container">
    <h2>⚙️ Керування Магазином</h2>

    <div id="auth-block" class="card">
        <h4>🔑 Авторизація</h4>
        <input type="password" id="admin-pass" placeholder="Введіть пароль адміністратора">
        <button onclick="loadData()" class="btn save-btn" style="background: #0088cc;">Увійти</button>
    </div>

    <div id="admin-content" style="display:none;">
        <div class="card">
            <h4>📦 Редактор товару</h4>
            <div class="grid-form">
                <input type="hidden" id="p-id">

                <div>
                    <label>1. Назва товару</label>
                    <input type="text" id="p-name" placeholder="Наприклад: Маргарита">
                </div>

                <div>
                    <label>2. Ціна (грн)</label>
                    <input type="number" id="p-price" placeholder="500">
                </div>

                <div>
                    <label>3. Категорія</label>
                    <select id="p-category">
                        <option value="Піца">Піца</option>
                        <option value="Бургеры">Бургеры</option>
                        <option value="Напитки">Напитки</option>
                        <option value="Інше">Інше</option>
                    </select>
                </div>

                <div>
                    <label>4. Кількість на складі (шт)</label>
                    <input type="number" id="p-stock" placeholder="10">
                </div>

                <div class="full-width">
                    <label>5. Шлях до картинки (наприклад: img/pizza1.jpg)</label>
                    <input type="text" id="p-image" placeholder="img/назва.jpg">
                </div>

                <div class="full-width">
                    <label>6. Опис товару</label>
                    <textarea id="p-desc" rows="3" placeholder="Склад, вага, особливості..."></textarea>
                </div>
            </div>
            <button onclick="saveProduct()" class="btn save-btn">Зберегти товар</button>
            <button onclick="resetForm()" class="btn" style="background:none; color: #888; width: 100%;">Очистити форму</button>
        </div>

        <table id="products-table">
            <thead>
            <tr>
                <th>Фото</th>
                <th>Назва / Категорія</th>
                <th>Ціна</th>
                <th>Склад</th>
                <th>Дії</th>
            </tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>
</div>

<script>
    let allProducts = [];

    async function loadData() {
        const pass = document.getElementById('admin-pass').value;
        if (!pass) return;

        try {
            const res = await fetch('products.json?v=' + Date.now());
            allProducts = await res.json();
            document.getElementById('auth-block').style.display = 'none';
            document.getElementById('admin-content').style.display = 'block';
            renderTable();
        } catch (e) { alert("Помилка доступу"); }
    }

    function renderTable() {
        const tbody = document.querySelector('#products-table tbody');
        tbody.innerHTML = allProducts.map(p => `
            <tr>
                <td><img src="${p.image}" class="img-preview" onerror="this.src='https://via.placeholder.com/50'"></td>
                <td><b>${p.name}</b><br><small style="color: #888">${p.category}</small></td>
                <td>${p.price} грн</td>
                <td><span class="stock-tag ${p.stock < 5 ? 'low' : 'ok'}">${p.stock} шт</span></td>
                <td>
                    <button class="btn" style="background:#e3f2fd; color:#0088cc; padding: 5px 10px;" onclick="fillForm(${p.id})">⚙️</button>
                </td>
            </tr>
        `).join('');
    }

    function fillForm(id) {
        const p = allProducts.find(x => x.id == id);
        document.getElementById('p-id').value = p.id;
        document.getElementById('p-name').value = p.name;
        document.getElementById('p-price').value = p.price;
        document.getElementById('p-stock').value = p.stock;
        document.getElementById('p-category').value = p.category;
        document.getElementById('p-desc').value = p.description || "";
        document.getElementById('p-image').value = p.image || "";
        window.scrollTo({top: 0, behavior: 'smooth'});
    }

    async function saveProduct() {
        const id = document.getElementById('p-id').value;
        const product = {
            id: id ? parseInt(id) : Date.now(),
            name: document.getElementById('p-name').value,
            price: parseInt(document.getElementById('p-price').value),
            category: document.getElementById('p-category').value,
            stock: parseInt(document.getElementById('p-stock').value),
            image: document.getElementById('p-image').value,
            description: document.getElementById('p-desc').value
        };

        if (id) {
            const idx = allProducts.findIndex(x => x.id == id);
            allProducts[idx] = product;
        } else {
            allProducts.push(product);
        }

        const pass = document.getElementById('admin-pass').value;
        const res = await fetch('/api/admin/save', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ password: pass, filename: 'products.json', data: allProducts })
        });

        if (res.ok) {
            alert("Збережено!");
            renderTable();
            resetForm();
        }
    }

    function resetForm() {
        document.getElementById('p-id').value = "";
        document.querySelectorAll('#admin-content input, #admin-content textarea').forEach(i => i.value = "");
    }
</script>
</body>
</html>
