<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Панель управления Shop</title>
    <style>
        body { font-family: sans-serif; padding: 30px; background: #f0f2f5; }
        .card { max-width: 400px; margin: auto; background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        input { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background: #0088cc; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; }
        #log { margin-top: 15px; font-size: 13px; color: #555; white-space: pre-wrap; }
    </style>
</head>
<body>

<div class="card">
    <h2>Новый товар</h2>
    <input type="password" id="token" placeholder="Ваш GitHub Токен (ghp_...)">
    <hr>
    <input type="text" id="name" placeholder="Название (например, Пицца)">
    <input type="number" id="price" placeholder="Цена">
    <input type="text" id="cat" placeholder="Категория">
    <input type="text" id="img" placeholder="Ссылка на фото">
    <button onclick="send()">Добавить в магазин</button>
    <div id="log"></div>
</div>

<script>
const REPO = 'vic-odessa-shop/shop-test';
const FILE = 'products.json';

async function send() {
    const log = document.getElementById('log');
    const token = document.getElementById('token').value;
    log.innerText = "⏳ Связываюсь с GitHub...";

    try {
        // 1. Получаем текущий файл и его SHA
        const getUrl = `https://api.github.com/repos/${REPO}/contents/${FILE}`;
        const res = await fetch(getUrl, {
            headers: { 'Authorization': `token ${token}` }
        });

        if (!res.ok) throw new Error("Не нашел файл или токен неверный");
        const data = await res.json();

        // Декодируем текущие товары
        const content = decodeURIComponent(escape(atob(data.content.replace(/\s/g, ''))));
        let products = JSON.parse(content);

        // 2. Добавляем новый товар
        const newItem = {
            id: Date.now(),
            name: document.getElementById('name').value,
            price: parseInt(document.getElementById('price').value),
            category: document.getElementById('cat').value,
            image: document.getElementById('img').value || "https://loremflickr.com/300/300/food"
        };
        products.push(newItem);

        // 3. Сохраняем обратно
        const updatedB64 = btoa(unescape(encodeURIComponent(JSON.stringify(products, null, 2))));

        const putRes = await fetch(getUrl, {
            method: 'PUT',
            headers: {
                'Authorization': `token ${token}`,
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({
                message: "Добавлен товар через админку",
                content: updatedB64,
                sha: data.sha
            })
        });

        if (putRes.ok) {
            log.innerText = "✅ Успешно! Товар добавлен. Обновите магазин через минуту.";
        } else {
            const err = await putRes.json();
            throw new Error(err.message);
        }

    } catch (e) {
        log.innerText = "❌ Ошибка: " + e.message;
    }
}
</script>
</body>
</html>
