<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Vic Odessa Shop</title>
    <link rel="stylesheet" href="style.css"> </head>
<body>

<h1 id="main-title" style="cursor: pointer; user-select: none;">VIC ODESSA SHOP</h1>

<div id="products-container" class="products-grid">
</div>

<script>
        // Конфигурация: путь к твоей базе данных
        const DATA_URL = 'products.json';

        // Ждем полной загрузки HTML-структуры страницы
        document.addEventListener('DOMContentLoaded', () => {

            // --- 1. ЛОГИКА ВЫВОДА ТОВАРОВ ---
            const container = document.getElementById('products-container');

            async function loadProducts() {
                try {
                    const response = await fetch(DATA_URL);
                    if (!response.ok) throw new Error('Ошибка загрузки JSON');

                    const products = await response.json();
                    renderCards(products);
                } catch (error) {
                    console.error('Ошибка:', error);
                    if (container) container.innerHTML = '<p>Не удалось загрузить товары.</p>';
                }
            }

            // Функция отрисовки карточек
            function renderCards(items) {
                if (!container) return;

                container.innerHTML = items.map(product => `
                    <div class="product-card">
                        <img src="${product.image}" alt="${product.name}">
                        <h3>${product.name}</h3>
                        <p>Цена: ${product.price} грн</p>
                        <button onclick="addToCart(${product.id})">Купить</button>
                    </div>
                `).join('');
            }

            // --- 2. СЕКРЕТНЫЙ ВХОД В АДМИНКУ ---
            const title = document.getElementById('main-title');
            let clicks = 0;
            let timer;

            if (title) {
                title.addEventListener('click', () => {
                    clicks++;
                    clearTimeout(timer);

                    // Если сделано 5 кликов за 3 секунды
                    if (clicks === 5) {
                        window.location.href = 'admin.html';
                    }

                    // Сброс счетчика через 3 секунды затишья
                    timer = setTimeout(() => { clicks = 0; }, 3000);
                });
            }

            // Запускаем загрузку товаров
            loadProducts();
        });

        // Функция для кнопки "Купить" (вынесена из DOMContentLoaded для доступа из HTML)
        function addToCart(productId) {
            alert('Товар ' + productId + ' добавлен в корзину (функционал в разработке)');
        }
    </script>
</body>
</html>
