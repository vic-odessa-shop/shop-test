<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Shop Test</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { font-family: sans-serif; background-color: #f0f0f0; margin: 0; padding: 20px; text-align: center; }
        .product-card { background: white; border-radius: 10px; padding: 15px; margin-bottom: 10px; shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .btn { background: #0088cc; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; }
        #loading { font-weight: bold; margin-top: 50px; }
    </style>
</head>
<body>

<div id="app">
    <h2 style="color: #0088cc;">VIC ODESSA SHOP</h2>
    <div id="loading">Завантаження товарів...</div>
    <div id="container"></div>
</div>

<script>
    // 1. Инициализация Telegram
    const tg = window.Telegram?.WebApp;
    if (tg) {
        tg.ready();
        tg.expand();
    }

    const API_URL = 'https://shop-test-zcei.onrender.com/api/send-order';
    let products = [];

    // 2. Функция загрузки
    async function loadData() {
        try {
            // Добавляем случайное число к ссылке, чтобы избежать кэша
            const response = await fetch('products.json?v=' + Math.random());
            products = await response.json();

            document.getElementById('loading').style.display = 'none';
            render(products);
        } catch (err) {
            document.getElementById('loading').innerText = "Помилка завантаження. Перевірте файл products.json";
            console.error(err);
        }
    }

    function render(items) {
        const container = document.getElementById('container');
        container.innerHTML = items.map(p => `
            <div class="product-card">
                <img src="${p.image}" style="width:100px; height:100px; object-fit:cover; border-radius:5px;">
                <h3>${p.name}</h3>
                <p>Ціна: ${p.price} ₴</p>
                <button class="btn" onclick="makeOrder('${p.name}')">Замовити</button>
            </div>
        `).join('');
    }

    async function makeOrder(itemName) {
        const name = "Клієнт (Телефон)";
        const phone = "Через Telegram App";

        try {
            const res = await fetch(API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    order: `Швидке замовлення: ${itemName}\nКлієнт: ${name}`,
                    cart: { item: itemName }
                })
            });
            if (res.ok) alert("Замовлення відправлено!");
        } catch (e) {
            alert("Помилка при відправці");
        }
    }

    // Запуск
    loadData();
</script>
</body>
</html>
