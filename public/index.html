<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Vic Odessa Shop</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root { --tg-color: #0088cc; }
        body { font-family: sans-serif; background: #f4f4f4; margin: 0; padding-bottom: 120px; }
        header { background: #fff; padding: 10px; text-align: center; position: sticky; top: 0; z-index: 100; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .categories { display: flex; overflow-x: auto; padding: 10px; gap: 8px; scrollbar-width: none; }
        .cat-btn { background: #e0e0e0; border: none; padding: 8px 15px; border-radius: 20px; white-space: nowrap; font-size: 13px; font-weight: bold; }
        .cat-btn.active { background: var(--tg-color); color: #fff; }

        /* СЕТКА 2 В РЯД */
        .products-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 10px; }
        .product-card { background: #fff; border-radius: 12px; padding: 10px; display: flex; flex-direction: column; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .product-card img { width: 100%; height: 100px; object-fit: cover; border-radius: 8px; }
        .product-name { font-size: 14px; font-weight: bold; margin: 8px 0; height: 35px; overflow: hidden; }
        .card-footer { display: flex; justify-content: space-between; align-items: center; margin-top: auto; }
        .price { font-weight: bold; font-size: 15px; }
        .add-btn { background: var(--tg-color); color: #fff; border: none; width: 35px; height: 35px; border-radius: 50%; font-weight: bold; font-size: 18px; }

        #order-ui { position: fixed; bottom: 20px; left: 5%; width: 90%; z-index: 1000; display: none; }
        #customer-form { background: #fff; padding: 15px; border-radius: 15px; box-shadow: 0 -5px 20px rgba(0,0,0,0.1); margin-bottom: 10px; }
        #customer-form input { width: 100%; padding: 12px; margin-top: 8px; border: 1px solid #ddd; border-radius: 10px; box-sizing: border-box; font-size: 16px; }
        #main-button { background: var(--tg-color); color: #fff; padding: 18px; border-radius: 15px; text-align: center; font-weight: bold; cursor: pointer; }
        .loading { background: #777 !important; cursor: wait; }
    </style>
</head>
<body>

<header>
    <div style="font-weight: 900; color: var(--tg-color); margin-bottom: 5px;">VIC ODESSA SHOP</div>
    <div class="categories" id="cat-list">
        <button class="cat-btn active" onclick="filter('all', this)">Все</button>
    </div>
</header>

<div class="products-grid" id="container"></div>

<div id="order-ui">
    <div id="customer-form" style="display: none;">
        <input type="text" id="cust-name" placeholder="Ваше ім'я">
        <input type="tel" id="cust-phone" placeholder="Номер телефону">
    </div>
    <div id="main-button" onclick="handleButtonClick()">
        КОШИК: <span id="total-price">0</span> ₴
    </div>
</div>

<script>
    const tg = window.Telegram?.WebApp;
    const API_URL = 'https://shop-test-zcei.onrender.com';
    let allProducts = [];
    let cart = {};

    async function load() {
        try {
            const r = await fetch('products.json?v=' + Date.now());
            allProducts = await r.json();
            const cats = [...new Set(allProducts.map(p => p.category))].filter(Boolean);
            cats.forEach(c => {
                document.getElementById('cat-list').innerHTML += `<button class="cat-btn" onclick="filter('${c}', this)">${c}</button>`;
            });
            render(allProducts);
        } catch (e) { alert("Помилка завантаження"); }
    }

    function render(items) {
        const root = document.getElementById('container');
        root.innerHTML = items.map(p => {
            const qty = cart[p.name] || 0;
            return `<div class="product-card">
                <img src="${p.image || ''}">
                <div class="product-name">${p.name}</div>
                <div class="card-footer">
                    <span class="price">${p.price} ₴</span>
                    <button class="add-btn" onclick="addToCart('${p.name}')">${qty > 0 ? qty : '+'}</button>
                </div>
            </div>`;
        }).join('');
    }

    function addToCart(name) {
        cart[name] = (cart[name] || 0) + 1;
        updateUI();
        render(getCurrentItems());
    }

    function updateUI() {
        let sum = 0;
        for (let name in cart) {
            const p = allProducts.find(x => x.name === name);
            if (p) sum += p.price * cart[name];
        }
        document.getElementById('order-ui').style.display = sum > 0 ? 'block' : 'none';
        document.getElementById('total-price').innerText = sum;
    }

    function handleButtonClick() {
        const form = document.getElementById('customer-form');
        if (form.style.display === 'none') {
            form.style.display = 'block';
            document.getElementById('main-button').innerText = "ПІДТВЕРДИТИ ЗАМОВЛЕННЯ";
        } else {
            send();
        }
    }

    async function send() {
        const name = document.getElementById('cust-name').value;
        const phone = document.getElementById('cust-phone').value;
        const btn = document.getElementById('main-button');

        if (!name || !phone) return alert("Заповніть контакти!");

        btn.classList.add('loading');
        btn.innerText = "ПРОКИДАЮСЬ (чекайте 30 сек)...";

        let itemsText = "";
        let sum = 0;
        for (let n in cart) {
            itemsText += `\n• ${n} (${cart[n]} шт.)`;
            const p = allProducts.find(x => x.name === n);
            if(p) sum += p.price * cart[n];
        }

        const trySend = async () => {
            try {
                const res = await fetch(API_URL + '/api/send-order', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        order: `👤 Клієнт: ${name}\n📞 Тел: ${phone}\n🛒 Товари:${itemsText}`,
                        total: sum
                    })
                });
                if (res.ok) {
                    alert("Замовлення прийнято!");
                    location.reload();
                } else { throw new Error(); }
            } catch (e) {
                // Если ошибка — пробуем еще раз через 3 секунды, пока сервер не проснется
                setTimeout(trySend, 3000);
            }
        };

        trySend();
    }

    function filter(cat, btn) {
        document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        window.currentCat = cat;
        render(getCurrentItems());
    }

    function getCurrentItems() {
        return (window.currentCat && window.currentCat !== 'all')
            ? allProducts.filter(p => p.category === window.currentCat)
            : allProducts;
    }

    load();
</script>
</body>
</html>
