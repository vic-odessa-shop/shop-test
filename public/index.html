<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Shop</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body {
            font-family: sans-serif;
            margin: 0;
            padding: 12px;
            background: #f5f5f5;
        }

        .products {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 12px;
        }

        .card {
            background: white;
            border-radius: 12px;
            padding: 10px;
            text-align: center;
            position: relative;
        }

        .count-btn {
            margin-top: 6px;
            padding: 6px 10px;
            border-radius: 8px;
            border: none;
            background: #2196f3;
            color: white;
            cursor: pointer;
            font-size: 16px;
        }

        #order-ui {
            display: none;
            position: fixed;
            inset: 0;
            background: #ffffff;
            z-index: 800;
            padding: 16px;
            overflow-y: auto;
        }

        input {
            width: 100%;
            margin-bottom: 8px;
            padding: 8px;
            font-size: 16px;
        }

        button {
            padding: 10px;
            font-size: 16px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
        }
    </style>
</head>

<body>

<h2>Товари</h2>

<div class="products" id="products"></div>

<button onclick="openCart()" style="margin-top:16px;width:100%">
    🛒 Кошик
</button>

<!-- UI корзины -->
<div id="order-ui"></div>

<!-- Блокировка интерфейса -->
<div id="ui-lock" style="
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.35);
    z-index:900;
"></div>

<!-- Успешный заказ -->
<div id="success-modal" style="
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.45);
    z-index:1000;
    align-items:center;
    justify-content:center;
">
    <div style="
        background:#2e7d32;
        color:white;
        padding:24px;
        border-radius:14px;
        max-width:320px;
        text-align:center;
    ">
        <h3>✅ Замовлення прийнято</h3>
        <p>Дякуємо! Ми вже отримали ваше замовлення.</p>
        <button onclick="closeSuccessModal()">OK</button>
    </div>
</div>

<script src="app.js"></script>
</body>
</html>
