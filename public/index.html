<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Vic Odessa Shop</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root { --tg-color: #0088cc; --bg-color: #f4f4f7; --card-bg: #ffffff; --text-main: #222; }
        body { font-family: -apple-system, system-ui, sans-serif; background: var(--bg-color); margin: 0; padding-bottom: 140px; color: var(--text-main); user-select: none; }
        header { background: var(--card-bg); padding: 15px; text-align: center; position: sticky; top: 0; z-index: 100; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
        .categories { display: flex; overflow-x: auto; padding: 10px 5px; gap: 10px; scrollbar-width: none; }
        .categories::-webkit-scrollbar { display: none; }
        .cat-btn { background: #e0e0e0; border: none; padding: 8px 20px; border-radius: 20px; white-space: nowrap; font-size: 14px; font-weight: 600; cursor: pointer; }
        .cat-btn.active { background: var(--tg-color); color: #fff; }

        /* Исправленная сетка */
        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 8px;
            padding: 10px;
        }

        .product-card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 8px;
            display: flex;
            flex-direction: column;
            position: relative;
            box-shadow: 0 4px 10px rgba(0,0,0,0.04);
            min-width: 0;
        }

        .info-icon { position: absolute; top: 5px; right: 5px; background: rgba(255,255,255,0.9); border-radius: 50%; width: 26px; height: 26px; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: bold; color: var(--tg-color); cursor: pointer; border: 1px solid var(--tg-color); z-index: 2; }
        .product-card img { width: 100%; height: 110px; object-fit: cover; border-radius: 10px; background: #eee; }

        .product-name {
            font-size: 13px;
            font-weight: 600;
            margin: 8px 0 4px 0;
            height: 34px;
            line-height: 1.2;
            overflow: hidden;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
        }

        .card-footer { display: flex; justify-content: space-between; align-items: center; margin-top: auto; }
        .price { font-weight: 800; font-size: 16px; }
        .add-btn { background: var(--tg-color); color: #fff; border: none; width: 36px; height: 36px; border-radius: 50%; font-size: 20px; font-weight: bold; cursor: pointer; }

        /* Исправленный UI корзины */
        #order-ui {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: var(--card-bg);
            box-shadow: 0 -5px 20px rgba(0,0,0,0.1);
            border-radius: 20px 20px 0 0;
            padding: 15px;
            box-sizing: border-box;
            z-index: 1000;
            display: none; /* Скрыто по умолчанию */
        }

        #customer-form input { width: 100%; padding: 12px; margin-bottom: 8px; border: 1px solid #ddd; border-radius: 10px; box-sizing: border-box; font-size: 16px; }
        .btn-group { display: flex; gap: 10px; }
        #main-button { flex: 3; background: var(--tg-color); color: #fff; padding: 16px; border-radius: 14px; text-align: center; font-weight: bold; cursor: pointer; }
        #cancel-button { flex: 1; background: #ff3b30; color: #fff; padding: 16px; border-radius: 14px; text-align: center; font-weight: bold; cursor: pointer; }
        .loading-state { background: #999 !important; pointer-events: none; opacity: 0.7; }
    </style>
</head>
<body>

<header>
    <div style="font-weight: 900; color: var(--tg-color); font-size: 20px;">VIC ODESSA SHOP</div>
    <div class="categories" id="cat-list"><button class="cat-btn active" onclick="filter('all', this)">Всі</button></div>
</header>

<div class="products-grid" id="container"></div>

<div id="order-ui">
    <div id="customer-form" style="display: none;">
        <input type="text" id="cust-name" placeholder="Ваше ім'я">
        <input type="tel" id="cust-phone" placeholder="Номер телефону">
    </div>
    <div class="btn-group">
        <div id="cancel-button" onclick="cancelOrder()">❌</div>
        <div id="main-button" onclick="handleButtonClick()">КОШИК: <span id="total-price">0</span> ₴</div>
    </div>
</div>


<footer id="shop-footer" style="padding:10px 15px; background:#fff; text-align:center; font-size:14px; color:#222; box-shadow: 0 -2px 5px rgba(0,0,0,0.05);">
    <div>📍 Адрес: м. Одеса, вул. Дерибасівська, 1</div>
    <div style="margin-top:5px;">
        <a href="https://t.me/vicodessashop" target="_blank" style="color:#0088cc; text-decoration:none; margin-right:10px;">Telegram</a>
        <a href="viber://chat?number=%2B380000000000" target="_blank" style="color:#59267c; text-decoration:none;">Viber</a>
    </div>
</footer>




<script>
    const tg = window.Telegram?.WebApp;
    const API_URL = 'https://shop-test-zcei.onrender.com';
    let allProducts = [], cart = {}, isSending = false;

    async function load() {
        if (tg) { tg.ready(); tg.expand(); }
        try {
            const r = await fetch('products.json?v=' + Date.now());
            allProducts = await r.json();
            const cats = [...new Set(allProducts.map(p => p.category))].filter(Boolean);
            cats.forEach(c => { document.getElementById('cat-list').innerHTML += `<button class="cat-btn" onclick="filter('${c}', this)">${c}</button>`; });
            if (tg?.initDataUnsafe?.user?.first_name) document.getElementById('cust-name').value = tg.initDataUnsafe.user.first_name;
            render(allProducts);
        } catch (e) { console.error("Load error"); }
    }

    function render(items) {
        document.getElementById('container').innerHTML = items.map(p => `
            <div class="product-card">
                <div class="info-icon" onclick="showDesc('${p.name}', '${p.desc || 'Смачна позиція нашого меню'}')">i</div>
                <img src="${p.image || ''}" onerror="this.src='https://placehold.co/200?text=VIC+ODESSA'">
                <div class="product-name">${p.name}</div>
                <div class="card-footer">
                    <span class="price">${p.price} ₴</span>
                    <button class="add-btn" onclick="addToCart('${p.name}')">${cart[p.name] || '+'}</button>
                </div>
            </div>`).join('');
    }

    function addToCart(name) {
        cart[name] = (cart[name] || 0) + 1;
        updateUI();
        render(getCurrentItems());
        if (tg) tg.HapticFeedback.impactOccurred('medium');
    }

    function updateUI() {
        let sum = 0;
        for (let n in cart) {
            const p = allProducts.find(x => x.name === n);
            if (p) sum += p.price * cart[n];
        }

        const ui = document.getElementById('order-ui');
        if (sum > 0) {
            ui.style.display = 'block';
        } else {
            ui.style.display = 'none';
        }
        document.getElementById('total-price').innerText = sum;
    }

    function handleButtonClick() {
        const form = document.getElementById('customer-form');
        const btn = document.getElementById('main-button');
        if (form.style.display === 'none') {
            form.style.display = 'block';
            btn.innerText = "ПІДТВЕРДИТИ ЗАМОВЛЕННЯ";
        } else {
            executeOrderAlgorithm();
        }
    }

    async function executeOrderAlgorithm() {
        if (isSending) return;
        const name = document.getElementById('cust-name').value.trim();
        const phone = document.getElementById('cust-phone').value.trim();
        const btn = document.getElementById('main-button');
        if (!name || !phone) return alert("Вкажіть контакти!");

        isSending = true;
        btn.classList.add('loading-state');

        // 1. Прозвонка
        let ready = false; let attempts = 0;
        while (!ready && attempts < 15) {
            btn.innerText = `ЗВ'ЯЗОК... ${attempts + 1}`;
            try {
                const check = await fetch(API_URL + '/', { mode: 'cors', cache: 'no-cache' });
                if (check.ok) ready = true;
            } catch (e) { console.log("Чекаємо..."); }
            if (!ready) { attempts++; await new Promise(r => setTimeout(r, 2000)); }
        }

        // 2. Дані
        btn.innerText = "ОБРОБКА...";
        let itemsText = ""; let sum = 0;
        for (let n in cart) {
            itemsText += `\n• ${n} (${cart[n]} шт.)`;
            const p = allProducts.find(x => x.name === n); if(p) sum += p.price * cart[n];
        }

        // 3. Відправка
        btn.innerText = "ВІДПРАВКА...";
        try {
            await fetch(API_URL + '/api/send-order', {
                method: 'POST',
                mode: 'cors',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    order: `👤 Клієнт: ${name}\n📞 Тел: ${phone}\n🆔 ID: ${tg?.initDataUnsafe?.user?.id || 'PC-USER'} (@${tg?.initDataUnsafe?.user?.username || '-'}) \n🛒 Товари:${itemsText}`,
                    total: sum
                })
            });
        } catch (e) { console.log("Пакет пішов"); }

        // 4. Фінал
        btn.innerText = "ГОТОВО!";
        if (tg && tg.showPopup) {
            tg.showPopup({
                title: 'Замовлення прийнято!',
                message: 'Ми вже готуємо ваш чек.',
                buttons: [{type: 'ok', text: 'ОК'}]
            }, () => tg.close());
        } else {
            alert("Дякуємо! Ваше замовлення прийнято.");
            location.reload();
        }
    }

    function showDesc(name, desc) { if (tg) tg.showAlert(`${name}\n\n${desc}`); else alert(`${name}\n\n${desc}`); }
    function cancelOrder() { if(confirm("Очистити кошик?")) { cart = {}; document.getElementById('customer-form').style.display = 'none'; document.getElementById('main-button').innerText = "КОШИК: 0 ₴"; updateUI(); render(getCurrentItems()); } }
    function filter(cat, btn) { document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active')); btn.classList.add('active'); window.currentCat = cat; render(getCurrentItems()); }
    function getCurrentItems() { return (window.currentCat && window.currentCat !== 'all') ? allProducts.filter(p => p.category === window.currentCat) : allProducts; }
    load();
</script>
</body>
</html>
