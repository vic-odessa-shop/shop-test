<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Vic Odessa Shop</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root { --tg-color: #0088cc; --bg-color: #f4f4f7; --card-bg: #ffffff; }
        body { font-family: sans-serif; background: var(--bg-color); margin: 0; padding-bottom: 140px; user-select: none; }
        header { background: var(--card-bg); padding: 15px; text-align: center; position: sticky; top: 0; z-index: 100; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
        .categories { display: flex; overflow-x: auto; padding: 10px 5px; gap: 10px; scrollbar-width: none; }
        .categories::-webkit-scrollbar { display: none; }
        .cat-btn { background: #e0e0e0; border: none; padding: 8px 20px; border-radius: 20px; white-space: nowrap; font-size: 14px; font-weight: 600; }
        .cat-btn.active { background: var(--tg-color); color: #fff; }
        .products-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 12px; padding: 12px; }
        .product-card { background: var(--card-bg); border-radius: 15px; padding: 10px; display: flex; flex-direction: column; position: relative; box-shadow: 0 4px 10px rgba(0,0,0,0.04); }
        .product-card img { width: 100%; height: 120px; object-fit: cover; border-radius: 12px; }
        .price { font-weight: 800; font-size: 16px; }
        .add-btn { background: var(--tg-color); color: #fff; border: none; width: 36px; height: 36px; border-radius: 50%; font-size: 20px; }
        #order-ui { position: fixed; bottom: 0; left: 0; width: 100%; background: var(--card-bg); box-shadow: 0 -5px 20px rgba(0,0,0,0.1); border-radius: 20px 20px 0 0; padding: 15px; box-sizing: border-box; z-index: 1000; display: none; }
        #customer-form input { width: 100%; padding: 12px; margin-bottom: 8px; border: 1px solid #ddd; border-radius: 10px; box-sizing: border-box; }
        .btn-group { display: flex; gap: 10px; }
        #main-button { flex: 3; background: var(--tg-color); color: #fff; padding: 16px; border-radius: 14px; text-align: center; font-weight: bold; }
        #cancel-button { flex: 1; background: #ff3b30; color: #fff; padding: 16px; border-radius: 14px; text-align: center; }
        .loading-state { background: #999 !important; pointer-events: none; }
    </style>
</head>
<body>

<header>
    <div style="font-weight: 900; color: var(--tg-color); font-size: 20px;">VIC ODESSA SHOP</div>
    <div class="categories" id="cat-list"><button class="cat-btn active" onclick="filter('all', this)">Всі</button></div>
</header>
<div class="products-grid" id="container"></div>

<div id="order-ui">
    <div id="customer-form" style="display: none;">
        <input type="text" id="cust-name" placeholder="Ваше ім'я">
        <input type="tel" id="cust-phone" placeholder="Номер телефону">
    </div>
    <div class="btn-group">
        <div id="cancel-button" onclick="cancelOrder()">❌</div>
        <div id="main-button" onclick="handleButtonClick()">КОШИК: <span id="total-price">0</span> ₴</div>
    </div>
</div>

<script>
    const tg = window.Telegram?.WebApp;
    const API_URL = 'https://shop-test-zcei.onrender.com';
    let allProducts = [], cart = {}, isSending = false;

    async function load() {
        try {
            const r = await fetch('products.json?v=' + Date.now());
            allProducts = await r.json();
            const cats = [...new Set(allProducts.map(p => p.category))].filter(Boolean);
            cats.forEach(c => { document.getElementById('cat-list').innerHTML += `<button class="cat-btn" onclick="filter('${c}', this)">${c}</button>`; });
            if (tg?.initDataUnsafe?.user?.first_name) document.getElementById('cust-name').value = tg.initDataUnsafe.user.first_name;
            render(allProducts);
        } catch (e) { console.error(e); }
    }

    function render(items) {
        document.getElementById('container').innerHTML = items.map(p => `
            <div class="product-card">
                <img src="${p.image || ''}">
                <div style="font-size:14px; font-weight:600; margin:10px 0; height:38px;">${p.name}</div>
                <div style="display:flex; justify-content:space-between; align-items:center; margin-top:auto;">
                    <span class="price">${p.price} ₴</span>
                    <button class="add-btn" onclick="addToCart('${p.name}')">${cart[p.name] || '+'}</button>
                </div>
            </div>`).join('');
    }

    function addToCart(name) {
        cart[name] = (cart[name] || 0) + 1;
        updateUI();
        render(getCurrentItems());
    }

    function updateUI() {
        let sum = 0; for (let n in cart) { const p = allProducts.find(x => x.name === n); if (p) sum += p.price * cart[n]; }
        document.getElementById('order-ui').style.display = sum > 0 ? 'block' : 'none';
        document.getElementById('total-price').innerText = sum;
    }

    function handleButtonClick() {
        const form = document.getElementById('customer-form');
        if (form.style.display === 'none') { form.style.display = 'block'; document.getElementById('main-button').innerText = "ПІДТВЕРДИТИ ЗАМОВЛЕННЯ"; }
        else sendOrderFlow();
    }

    // --- АЛГОРИТМ "ЕЛЕКТРОНІК": ОПРОС ГОТОВНОСТИ + ОТПРАВКА ---
    async function sendOrderFlow() {
        if (isSending) return;
        const name = document.getElementById('cust-name').value.trim();
        const phone = document.getElementById('cust-phone').value.trim();
        const btn = document.getElementById('main-button');
        if (!name || !phone) return alert("Вкажіть дані!");

        isSending = true;
        btn.classList.add('loading-state');

        // 1. Цикл прозвонки (будим сервер)
        let ready = false;
        let attempts = 0;

        while (!ready && attempts < 20) { // макс 60 секунд ожидания
            btn.innerText = `ПЕРЕВІРКА ЗВ'ЯЗКУ... ${attempts + 1}`;
            try {
                const check = await fetch(API_URL + '/', { mode: 'cors' });
                if (check.ok) { ready = true; }
            } catch (e) {
                console.log("Сервер ще не готовий...");
            }
            if (!ready) {
                attempts++;
                await new Promise(r => setTimeout(r, 3000)); // пауза между импульсами 3 сек
            }
        }

        if (!ready) {
            alert("Сервер не відповідає. Спробуйте пізніше.");
            isSending = false;
            btn.classList.remove('loading-state');
            return;
        }

        // 2. Сервер ответил OK — отправляем пакет данных один раз
        btn.innerText = "ВІДПРАВКА ЗАКАЗУ...";
        let itemsText = ""; let sum = 0;
        for (let n in cart) {
            itemsText += `\n• ${n} (${cart[n]} шт.)`;
            const p = allProducts.find(x => x.name === n); if(p) sum += p.price * cart[n];
        }

        try {
            const res = await fetch(API_URL + '/api/send-order', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    order: `👤 Клієнт: ${name}\n📞 Тел: ${phone}\n🆔 ID: ${tg?.initDataUnsafe?.user?.id || '?'}\n🛒 Товари:${itemsText}`,
                    total: sum
                })
            });
            if (res.ok) { tg.showAlert("Замовлення прийнято!", () => tg.close()); }
        } catch (e) {
            alert("Помилка передачі даних.");
            isSending = false;
            btn.classList.remove('loading-state');
        }
    }

    function cancelOrder() { if(confirm("Очистити кошик?")) { cart = {}; document.getElementById('customer-form').style.display = 'none'; updateUI(); render(allProducts); } }
    function filter(cat, btn) { document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active')); btn.classList.add('active'); window.currentCat = cat; render(getCurrentItems()); }
    function getCurrentItems() { return (window.currentCat && window.currentCat !== 'all') ? allProducts.filter(p => p.category === window.currentCat) : allProducts; }
    load();
</script>
</body>
</html>
