<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vic Odessa Shop</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
:root { --tg:#0088cc; --bg:#f4f4f7; }
body { margin:0; font-family:system-ui; background:var(--bg); padding-bottom:140px; }

header {
    position:sticky; top:0; z-index:100;
    background:#fff; padding:10px;
    box-shadow:0 2px 8px rgba(0,0,0,.05);
}

.products-grid {
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(140px,1fr));
    gap:8px; padding:10px;
}

.product-card {
    background:#fff;
    border-radius:12px;
    padding:8px;
    display:flex;
    flex-direction:column;
    position:relative;
}

.product-card img {
    width:100%; height:110px;
    object-fit:cover; border-radius:10px;
}

.product-name { font-size:13px; font-weight:600; margin:6px 0; }
.price { font-weight:800; }
.add-btn {
    width:36px; height:36px;
    border-radius:50%;
    background:var(--tg); color:#fff;
    border:none; font-size:18px;
}

#cart-count {
    position:absolute; top:-6px; right:-6px;
    background:red; color:#fff;
    width:18px; height:18px;
    border-radius:50%;
    font-size:12px;
    display:flex; align-items:center; justify-content:center;
}

#order-ui {
    position:fixed; inset:auto 0 0 0;
    background:#fff;
    padding:15px;
    border-radius:20px 20px 0 0;
    display:none;
    z-index:1000;
}

#success-modal, #clear-modal {
    position:fixed; inset:0;
    background:rgba(0,0,0,.5);
    display:none;
    align-items:center; justify-content:center;
    z-index:2000;
}
.modal-box {
    background:#fff; padding:24px;
    border-radius:16px;
    max-width:320px;
    text-align:center;
}
</style>
</head>

<body>

<header>
    <div style="display:flex;justify-content:space-between;align-items:center">
        <b style="color:var(--tg)">VIC ODESSA SHOP</b>
        <div onclick="toggleCart()" style="position:relative;cursor:pointer">
            <img src="icons/ico1.png" width="26">
            <span id="cart-count">0</span>
        </div>
    </div>
</header>

<div class="products-grid" id="container"></div>

<div id="order-ui">
    <div id="cart-items"></div>
    <div id="cart-total" style="margin:10px 0;font-weight:700"></div>

    <input id="cust-name" placeholder="Ваше ім'я">
    <input id="cust-phone" placeholder="Телефон">

    <div style="display:flex;gap:10px;margin-top:10px">
        <button onclick="askClear()" style="flex:1;background:#ff3b30;color:#fff">Очистити</button>
        <button onclick="handleOrder()" style="flex:2;background:var(--tg);color:#fff">Пiдтвердити</button>
    </div>
</div>

<!-- SUCCESS -->
<div id="success-modal">
  <div class="modal-box" style="background:#2e7d32;color:#fff">
    <h3>✅ Замовлення прийнято</h3>
    <p>Дякуємо! Ми отримали замовлення</p>
    <button onclick="closeSuccess()">OK</button>
  </div>
</div>

<!-- CLEAR -->
<div id="clear-modal">
  <div class="modal-box" style="border:2px solid #ff3b30">
    <h3>Видалити все?</h3>
    <button onclick="closeClear()">Відмінити</button>
    <button onclick="confirmClear()" style="background:#ff3b30;color:#fff">Підтвердити</button>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
